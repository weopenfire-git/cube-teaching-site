# cube 教学站（v2.0）：容器只做应用服务，TLS 与域名分流由宿主 nginx 统一承担
# 宿主 nginx（host-nginx/qingjian.conf）：80/443 按 server_name 分流
#   根域 / www → /opt/cube-deploy/portal（宿主直接静态）
#   cube 子域  → 反代 127.0.0.1:8081 → 本容器（site 静态 + /api 反代）
# 8081:80 同时供宿主反代与 IP 直连；宿主 443 归 nginx，本容器不再映射 443。
# cube-auth 不映射宿主端口，只在 docker 内网可达。
# 目录 /opt/cube-deploy、容器名 cube-web / cube-auth、卷 cube-auth-data 与航迹完全隔离。
services:
  cube-web:
    image: nginx:1.27-alpine
    container_name: cube-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cube-auth

  cube-auth:
    build: ./auth
    container_name: cube-auth
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - cube-auth-data:/data

volumes:
  cube-auth-data:
