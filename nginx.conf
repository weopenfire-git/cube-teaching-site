# cube 教学站 nginx 配置 —— 独立编写，不复用航迹的 CSP（航迹 CSP 禁外部请求/表单，会拦掉登录 API）
#
# 端口（宿主）  端口（容器）  用途
#   8081    →    80      IP 直连，向后兼容，继续提供魔方教学站
#   443     →    443     域名 HTTPS，Cloudflare 边缘回源到这里
#   宿主 80 已被航迹占用，本站绝不监听，也不修改航迹 nginx
#
# 证书：scripts/gen-origin-cert.sh 生成自签证书（Cloudflare Full 模式接受），ssl/ 不进 git
# 注意：nginx 的 add_header 不会跨 server 继承，每个 server 里都要写一遍

# ── 容器内 80：保留原有 IP:8081 直连 ──────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'" always;

    # 健康检查：后端路由是 /health，这里映射成对外统一的 /healthz
    location = /healthz {
        proxy_pass http://cube-auth:3001/health;
        proxy_set_header Host $host;
    }

    # 同源反代登录后端（容器内 3001，不对公网开放端口）
    location /api/ {
        proxy_pass http://cube-auth:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

# ── 容器内 443：公司主页（根域 + www） ────────────────────────────
server {
    listen 443 ssl;
    server_name qingjiansmart.com www.qingjiansmart.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/portal;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

# ── 容器内 443：魔方教学站（含登录 API 同源反代） ──────────────────
server {
    listen 443 ssl;
    server_name cube.qingjiansmart.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'" always;

    location = /healthz {
        proxy_pass http://cube-auth:3001/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://cube-auth:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
