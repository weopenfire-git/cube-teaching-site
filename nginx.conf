# cube 教学站 nginx 配置 —— 独立编写，不复用航迹的 CSP（航迹 CSP 禁外部请求/表单，会拦掉登录 API）
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（按本应用实际需要编写：页面全内联脚本/样式 + 本地 JS，无外部 CDN/字体）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'" always;

    # 健康检查：后端路由是 /health，这里映射成对外统一的 /healthz
    location = /healthz {
        proxy_pass http://cube-auth:3001/health;
        proxy_set_header Host $host;
    }

    # 同源反代登录后端（容器内 3001，不对公网开放端口）
    location /api/ {
        proxy_pass http://cube-auth:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
