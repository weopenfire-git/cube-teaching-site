# cube-web 容器内 nginx（v2.0）：只做应用服务，不做 TLS、不做域名分流
#
# 分流与 TLS 已上移到宿主 nginx（见 host-nginx/qingjian.conf）：
#   宿主 80/443 --按 server_name--> 根域 portal 静态 / cube 子域反代到 127.0.0.1:8081
# 本容器只保留一个 80 server，同时兼顾 IP:8081 直连（老链接不失效）。
#
# /api/ 反代到 cube-auth:3001 依赖 docker 内网 DNS，因此必须留在本容器内；
# cube-auth 没有宿主端口映射，宿主 nginx 无法直连它，也不对公网暴露。
#
# 安全响应头统一由本容器下发：宿主 nginx 作为纯分流层不给 cube 子域写 add_header，
# 避免同一响应出现重复的 CSP / X-Frame-Options 头。
# 注意：nginx 的 add_header 不会跨 server 继承，每个 server 里都要写一遍。
#
# 来源信息头（X-Real-IP / X-Forwarded-For / X-Forwarded-Proto）由宿主 nginx 注入，
# 本容器不再覆盖，nginx 默认会把这些请求头原样透传给 cube-auth。

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'" always;

    # 健康检查：后端路由是 /health，这里映射成对外统一的 /healthz
    location = /healthz {
        proxy_pass http://cube-auth:3001/health;
        proxy_set_header Host $host;
    }

    # 同源反代登录后端（容器内 3001，不对公网开放端口）
    location /api/ {
        proxy_pass http://cube-auth:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
