# =============================================================================
# 青简站点 宿主 nginx 统一入口（v2.0 架构反转）
# 安装位置：/etc/nginx/conf.d/qingjian.conf
# 来源仓：weopenfire-git/cube-teaching-site  host-nginx/qingjian.conf
#
# 设计要点
#   1 纯增量：不修改、不删除任何既有 server 块。宿主 80 上原有的 default_server
#     继续接收 IP 直连与未匹配流量；nginx 按 Host 精确匹配优先于 default_server，
#     因此带域名的请求会落到本文件，其余流量原样不动。
#   2 分流与 TLS 在宿主层完成，cube-web 容器回归纯应用（只监听容器 80，映射 8081）。
#   3 主站 portal 是纯静态，由宿主 nginx 直接 root 托管；cube 子域反代到 127.0.0.1:8081，
#     因为 /api/ 反代依赖 docker 内网 DNS 解析 cube-auth，必须留在容器内。
#   4 安全响应头：portal 由本文件下发；cube 子域由容器内 nginx 下发。
#     宿主层不给 cube 子域写 add_header，避免同一响应出现重复的 CSP 头。
#   5 证书：/opt/cube-deploy/ssl/origin.crt|key（scripts/gen-origin-cert.sh 生成）。
#     橙云阶段是自签证书（Cloudflare Full 接受）；灰云直连前必须换成正式证书。
#
# 注意：本文件 80 的 server 不带 default_server，避免与既有配置冲突；
#       仅 443 兜底块使用 default_server（443 原本空闲）。
# =============================================================================

# ── 一级主站 HTTP：跳 HTTPS，放行 ACME 挑战 ───────────────────────────────
server {
    listen 80;
    server_name qingjiansmart.com www.qingjiansmart.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/cube-deploy/portal;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 二级子站 HTTP：跳 HTTPS，放行 ACME 挑战 ───────────────────────────────
server {
    listen 80;
    server_name cube.qingjiansmart.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/cube-deploy/portal;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 兜底：IP 直接 HTTPS 或未知名 Host 一律断开，不暴露任何站点 ─────────────
# 若 nginx -t 报 "a duplicate default server"，说明既有配置已占用 443 default_server：
# 删除本段，或去掉下面 listen 里的 default_server 字样后重试。
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /opt/cube-deploy/ssl/origin.crt;
    ssl_certificate_key /opt/cube-deploy/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 444;
}

# ── 一级主站 HTTPS：公司主页（宿主直接静态，不经过容器） ────────────────────
server {
    listen 443 ssl;
    server_name qingjiansmart.com www.qingjiansmart.com;

    ssl_certificate     /opt/cube-deploy/ssl/origin.crt;
    ssl_certificate_key /opt/cube-deploy/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/cube-deploy/portal;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}

# ── 二级子站 HTTPS：魔方教学站 + 登录 API（反代到容器） ─────────────────────
server {
    listen 443 ssl;
    server_name cube.qingjiansmart.com;

    ssl_certificate     /opt/cube-deploy/ssl/origin.crt;
    ssl_certificate_key /opt/cube-deploy/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
